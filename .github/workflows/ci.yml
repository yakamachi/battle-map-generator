name: CI

# Gates every pull request to main; branch protection requires these jobs, and deploy.yml
# no longer runs tests. No paths/paths-ignore filters on purpose: a required check that
# never reports would block docs-only pull requests forever.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    # The API tests pull a ~2.3 GB SQL Server image; a stalled pull or hung test must not
    # hold the pull request for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Integration tests start SQL Server through Testcontainers (Docker is available on ubuntu-latest).
      - name: Test API
        run: dotnet test api.Tests -c Release

      # The same build steps deploy.yml runs after the merge, so a broken bundle or publish fails
      # the pull request instead of the deploy. Nothing is uploaded.
      - name: Build migration bundle and publish (as deploy.yml)
        run: |
          dotnet tool restore
          dotnet restore api
          dotnet ef migrations bundle --project api --self-contained -r linux-x64 -o efbundle/efbundle --force
          dotnet publish api -c Release -o publish

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Type-check and build web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      # Views use tokens and components, never literal colours, palette classes or dark: classes.
      - name: Scan for hardcoded UI values
        working-directory: web
        run: npm run ui:scan

  # Screenshot gate for the home view (API mocked), in the image the baselines were made in.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    env:
      # The image has no home directory for UID 1001; npm needs a writable one.
      HOME: /tmp
    steps:
      - uses: actions/checkout@v4

      - name: Build and run the visual tests
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run visual

      - name: Upload visual report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # The OpenAPI document and the TypeScript types generated from it are committed; a fresh
  # build that changes either means the contract drifted without the client following.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build API (regenerates the OpenAPI document)
        run: dotnet build api

      - name: Regenerate client types
        working-directory: web
        run: |
          npm ci
          npm run api:types

      - name: Fail on contract drift
        run: git diff --exit-code api/BattleMapGenerator.Api.json web/app/api/schema.d.ts

      # The render baselines hash the committed atlas, so it must be what the script produces
      # from the vendored pieces, on any machine.
      - name: Fail on atlas drift
        working-directory: web
        run: |
          npm run atlas
          git diff --exit-code app/map/tileset/

  # Mapping and rendering tests in real Chromium and Firefox, against the shared fixture grids.
  web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test web rendering
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
          npm test

  # Generate, preview and download in Chromium and Firefox against the .NET host serving the
  # built SPA. No database: startup and generation never touch it.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Install web and e2e dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix e2e

      - name: Type-check the end-to-end tests
        working-directory: e2e
        run: npm run typecheck

      - name: Build the SPA into the API's wwwroot
        working-directory: e2e
        run: npm run build:app

      - name: Run end-to-end tests
        working-directory: e2e
        run: |
          npx playwright install --with-deps chromium firefox
          npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
