name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The API tests pull a ~2.3 GB SQL Server image; a stalled pull or hung test must not hold
    # the deploy queue (cancel-in-progress is false) for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Integration tests start SQL Server through Testcontainers (Docker is available on ubuntu-latest).
      # A failing test stops the job before the deploy artifact is built.
      - name: Test API
        run: dotnet test api.Tests -c Release

      # Built from the same commit as the app. The host builds without a connection string;
      # the deploy job passes one at run time.
      - name: Build migration bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle --project api --self-contained -r linux-x64 -o efbundle/efbundle --force

      - name: Copy SPA into API wwwroot
        run: |
          mkdir -p api/wwwroot
          cp -r web/build/client/. api/wwwroot/

      - name: Publish API
        run: dotnet publish api -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: migrations
          path: efbundle/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Worst case is the ready smoke test (10 retries of up to 120 s plus 15 s delays); a hung
    # step must not hold the deploy queue (cancel-in-progress is false) for the 6-hour default.
    timeout-minutes: 40
    # Only this job signs in to Azure (OIDC), so only it may mint an ID token;
    # the build job runs third-party test dependencies.
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      # Separate path so the bundle never ends up inside the app package.
      - uses: actions/download-artifact@v4
        with:
          name: migrations
          path: efbundle

      # Artifacts do not keep the executable bit.
      - name: Make migration bundle executable
        run: chmod +x efbundle/efbundle

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The SQL server only allows Azure services; open it to this runner for the migration only.
      - name: Open SQL firewall for runner
        id: firewall
        run: |
          ip=$(curl -4 --fail --silent --show-error --retry 3 https://api.ipify.org)
          if ! [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "::error::Could not read the runner's public IPv4 (got '$ip')"
            exit 1
          fi
          az sql server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ vars.AZURE_SQL_SERVER }}" \
            --name "gh-runner-${{ github.run_id }}" \
            --start-ip-address "$ip" --end-ip-address "$ip" \
            --output none

      # Runs as id-battlemap-deploy through the Azure CLI login. A failure stops the job before the
      # new app is deployed. A paused free-offer database took about 3 minutes to resume, longer than
      # EF's own retries (about 1 minute), so the bundle is retried; re-running it only applies pending
      # migrations, each in its own transaction.
      - name: Apply migrations
        run: |
          conn="Server=tcp:${{ vars.AZURE_SQL_SERVER }}.database.windows.net,1433;Database=${{ vars.AZURE_SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True;Connect Timeout=60;"
          for attempt in 1 2 3 4 5; do
            if ./efbundle/efbundle --connection "$conn"; then
              exit 0
            fi
            echo "::warning::Migration attempt $attempt failed (the database may be resuming); retrying in 30 s"
            sleep 30
          done
          echo "::error::Migrations failed after 5 attempts"
          exit 1

      # Always runs (failure, cancel) once the rule may exist, so the server is never left open to this IP.
      # A missing rule is fine; a failed delete of an existing rule fails the job.
      - name: Close SQL firewall for runner
        if: always() && steps.firewall.outcome != 'skipped'
        run: |
          rule=(--resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --server "${{ vars.AZURE_SQL_SERVER }}" --name "gh-runner-${{ github.run_id }}")
          if az sql server firewall-rule show "${rule[@]}" --output none 2>/dev/null; then
            az sql server firewall-rule delete "${rule[@]}"
          else
            echo "Firewall rule gh-runner-${{ github.run_id }} not found; nothing to remove."
          fi

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Smoke test
        # F1 cold start can take tens of seconds.
        run: curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health/live

      - name: Smoke test readiness
        # Proves the app reaches its database as its own identity; the retries cover a resume from
        # auto-pause, and --max-time turns a hung request into a retry.
        env:
          HEALTH_READY_KEY: ${{ secrets.HEALTH_READY_KEY }}
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors --max-time 120 \
            -H "X-Health-Key: $HEALTH_READY_KEY" \
            https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health/ready
