name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The API tests pull a ~2.3 GB SQL Server image; a stalled pull or hung test must not hold
    # the deploy queue (cancel-in-progress is false) for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Integration tests start SQL Server through Testcontainers (Docker is available on ubuntu-latest).
      # A failing test stops the job before the deploy artifact is built.
      - name: Test API
        run: dotnet test api.Tests -c Release

      - name: Copy SPA into API wwwroot
        run: |
          mkdir -p api/wwwroot
          cp -r web/build/client/. api/wwwroot/

      - name: Publish API
        run: dotnet publish api -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job signs in to Azure (OIDC), so only it may mint an ID token;
    # the build job runs third-party test dependencies.
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: publish

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: publish

      - name: Smoke test
        # F1 cold start can take tens of seconds.
        run: curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health/live
