<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice Button Prototype</title>
<style>
  :root {
    --background: oklch(0.97 0.018 85); --foreground: oklch(0.22 0.02 60);
    --card: oklch(0.99 0.008 85); --primary: oklch(0.25 0.02 60); --primary-foreground: oklch(0.97 0.018 85);
    --accent: oklch(0.92 0.025 80); --accent-foreground: oklch(0.22 0.02 60);
    --border: oklch(0.85 0.03 75); --ring: oklch(0.5 0.08 60); --muted-foreground: oklch(0.48 0.03 65);
    --destructive: oklch(0.5 0.17 30);
  }
  :root.dark {
    --background: oklch(0.2 0.01 60); --foreground: oklch(0.93 0.02 85);
    --card: oklch(0.24 0.012 60); --primary: oklch(0.9 0.03 85); --primary-foreground: oklch(0.22 0.02 60);
    --accent: oklch(0.3 0.015 60); --accent-foreground: oklch(0.93 0.02 85);
    --border: oklch(1 0 0 / 12%); --ring: oklch(0.72 0.08 70); --muted-foreground: oklch(0.72 0.03 75);
    --destructive: oklch(0.68 0.15 30);
  }
  body { margin: 0; padding: 16px; background: var(--background); color: var(--foreground);
         font: 14px/1.4 Inter, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: var(--muted-foreground); margin: 0 0 16px; max-width: 70ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; align-items: center; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .card h2 { font-size: 14px; margin: 0 0 2px; }
  .card p { margin: 0 0 12px; color: var(--muted-foreground); font-size: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  select { font: inherit; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border);
           background: var(--background); color: var(--foreground); }
  .state { font-size: 12px; color: var(--muted-foreground); min-width: 5ch; }

  /* ---- the button ---- */
  .gen { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
         border-radius: 8px; border: 1px solid transparent; font: 500 14px Inter, system-ui, sans-serif;
         cursor: pointer; background: var(--primary); color: var(--primary-foreground);
         transition: background-color .25s, color .25s, border-color .25s; }
  .gen svg { width: 20px; height: 20px; flex: none; }
  .gen[disabled] { cursor: default; }
  .gen[data-state="reroll"] { background: var(--accent); color: var(--accent-foreground); border-color: var(--border); }
  .gen[data-state="reroll"]:hover { border-color: var(--ring); }
  .gen .icon-reroll { display: none; }
  .gen[data-state="reroll"] .icon-main { display: none; }
  .gen[data-state="reroll"] .icon-reroll { display: block; }

  /* Done: a one-shot ring pulse over the settled style. */
  .flash { animation: ring-pulse .7s ease-out; }
  @keyframes ring-pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--ring) 70%, transparent); }
    100% { box-shadow: 0 0 0 10px color-mix(in oklch, var(--ring) 0%, transparent); }
  }
  .shake { animation: shake .4s ease-in-out; }
  @keyframes shake { 20%,60% { transform: translateX(-4px); } 40%,80% { transform: translateX(4px); } }

  /* A: tumble — rotate in 60° hops with a little hop up (reads as rolling, not spinning). */
  [data-anim="tumble"][data-state="rolling"] .icon-main { animation: tumble .9s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes tumble {
    0% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-3px) rotate(90deg); }
    50% { transform: translateY(0) rotate(180deg); } 75% { transform: translateY(-3px) rotate(270deg); }
    100% { transform: translateY(0) rotate(360deg); }
  }
  /* B: wobble + flicker the face number (slot-machine). */
  [data-anim="flicker"][data-state="rolling"] .icon-main { animation: wobble .45s ease-in-out infinite; }
  @keyframes wobble { 0%,100% { transform: rotate(-14deg) scale(1); } 50% { transform: rotate(14deg) scale(1.08); } }
  .face { opacity: 0; }
  .face.final { opacity: 1; }
  [data-state="rolling"] .face.final { opacity: 0; }
  [data-anim="flicker"][data-state="rolling"] .face.spin { animation: flick .6s steps(1) infinite; }
  @keyframes flick { 0% { opacity: 1; } 17% { opacity: 0; } 100% { opacity: 0; } }
  /* D: tumble + flicker. D1 turns the whole die; D2 counter-rotates the faces so the numbers stay upright. */
  [data-anim="both"][data-state="rolling"] .icon-main,
  [data-anim="upright"][data-state="rolling"] .icon-main { animation: tumble .9s cubic-bezier(.5,0,.5,1) infinite; }
  [data-anim="both"][data-state="rolling"] .face.spin,
  [data-anim="upright"][data-state="rolling"] .face.spin { animation: flick .6s steps(1) infinite; }
  .faces { transform-box: view-box; transform-origin: 12px 12px; }
  [data-anim="upright"][data-state="rolling"] .faces { animation: untumble .9s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes untumble { 0% { transform: rotate(0); } 25% { transform: rotate(-90deg); } 50% { transform: rotate(-180deg); }
                        75% { transform: rotate(-270deg); } 100% { transform: rotate(-360deg); } }
  /* D3: D1, but the face changes on each quarter-turn "landing": 8 faces over two tumbles (1.8 s). */
  [data-anim="synced"][data-state="rolling"] .icon-main { animation: tumble .9s cubic-bezier(.5,0,.5,1) infinite; }
  [data-anim="synced"][data-state="rolling"] .face.sync { animation: flick8 1.8s steps(1) infinite; }
  .face.sync { opacity: 0; }
  @keyframes flick8 { 0% { opacity: 1; } 12.6% { opacity: 0; } 100% { opacity: 0; } }
  /* D4: D3's roll, then the d20 lands and pops into the two-dice Reroll icon. */
  [data-anim="final"][data-state="rolling"] .icon-main { animation: tumble .9s cubic-bezier(.5,0,.5,1) infinite; }
  [data-anim="final"][data-state="rolling"] .face.sync { animation: flick8 1.8s steps(1) infinite; }
  [data-anim="final"].flash .icon-reroll { animation: pop .35s cubic-bezier(.3,1.6,.6,1); }
  @keyframes pop { 0% { transform: scale(.4) rotate(-40deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  /* C: 3D flip on the Y axis (coin-like toss). */
  [data-anim="flip"][data-state="rolling"] .icon-main { animation: flip .7s linear infinite; }
  @keyframes flip { 0% { transform: perspective(60px) rotateY(0) rotateZ(0); }
                    50% { transform: perspective(60px) rotateY(180deg) rotateZ(30deg); }
                    100% { transform: perspective(60px) rotateY(360deg) rotateZ(0); } }

  /* The preview frame and its arrival flash. */
  .preview { margin-top: 12px; aspect-ratio: 3/2; border: 1px solid var(--border); border-radius: 8px;
             display: grid; place-items: center; color: var(--muted-foreground); font-size: 12px; overflow: hidden;
             background: var(--background); transition: opacity .2s; }
  .preview.dim { opacity: .4; }
  .preview.arrive { animation: arrive .7s ease-out; }
  @keyframes arrive {
    0% { box-shadow: inset 0 0 0 3px color-mix(in oklch, var(--ring) 80%, transparent); filter: brightness(1.15); }
    100% { box-shadow: inset 0 0 0 0 transparent; filter: none; }
  }
  .preview canvas { width: 100%; height: 100%; }

  :root.reduce * { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<h1>Generate button: dice prototypes</h1>
<p class="hint">Click Generate to roll. Change the room count after a roll and the button goes back to Ready. Tick “next roll fails” to see the error shake. All three use plain CSS @keyframes and an inline SVG; nothing here needs a library.</p>

<div class="controls">
  <label><input type="checkbox" id="dark"> Dark theme</label>
  <label><input type="checkbox" id="reduce"> Simulate reduced motion</label>
  <label><input type="checkbox" id="fail"> Next roll fails</label>
  <label>Roll time <select id="dur"><option value="400">0.4 s</option><option value="1200" selected>1.2 s</option><option value="2500">2.5 s</option></select></label>
</div>

<div class="grid" id="grid"></div>

<template id="tpl">
  <div class="card">
    <h2></h2><p></p>
    <div class="row">
      <label>Rooms <select class="rooms"><option>4</option><option selected>6</option><option>8</option></select></label>
      <button class="gen" data-state="ready"><span class="icons"></span>Generate</button>
      <span class="state" aria-live="polite"></span>
    </div>
    <div class="preview">Click Generate</div>
  </div>
</template>

<script>
// Icon paths: mdi (Apache-2.0), Font Awesome Free (CC BY 4.0), Line Awesome (MIT), all via Iconify.
const FA_D20 = '<svg viewBox="0 0 640 640" class="icon-main" aria-hidden="true"><path fill="currentColor" d="M288.4 55.8c19.6-11.1 43.6-11.1 63.1 0l192 108.8c20 11.4 32.4 32.6 32.4 55.7v215.6c0 23-12.4 44.3-32.4 55.7l-192 108.8c-19.6 11.1-43.6 11.1-63.1 0l-192-108.9c-20-11.4-32.4-32.7-32.4-55.7V220.2c0-23 12.4-44.3 32.4-55.7zm52 73.2c-9.4-15.2-31.4-15.2-40.8 0L223 252.7l-85.4-46.3l-3.8-1.6c-8.9-2.7-18.8 1.1-23.4 9.6s-2.4 18.9 4.7 24.8l3.3 2.3l83.4 45.2l-74.6 120.6c-7.9 12.9-2.2 29.7 11.8 35.1l161 61.9V544c0 11 9 20 20 20s20-9 20-20v-39.7l161-61.9c14-5.4 19.7-22.2 11.8-35l-74.7-120.6l83.4-45.2c9.7-5.3 13.3-17.4 8.1-27.1s-17.4-13.3-27.1-8.1L417 252.7zm-47 329.9l-122-46.9l54.5-88.1zM468.6 412l-122 46.9l67.5-135zm-85.3-116L320 422.6L256.7 296zM372 256H267.9l52-84l52 84z"/></svg>';
const LA_D20 = '<svg viewBox="0 0 32 32" class="icon-main" aria-hidden="true"><path fill="currentColor" d="m16 3.719l-.625.5l-8.25 6.406l-.25.219l-.094.312l-2.75 10.094l-.218.781L16 28.125l12.188-6.094l-.22-.781l-2.75-10.094l-.093-.312l-.25-.219l-8.25-6.406zm-1 3.344V10h-3.781zm2 0L20.781 10H17zM9.062 12H14l-3.594 4.781zM18 12h4.938l-1.344 4.781zm-2 .688L20 18h-8zM7.812 15l1 3.5l-2.25 1.125zm16.375 0l1.25 4.625l-2.25-1.125zM12 20h8l-4 5.313zm-2.313.281l2.938 3.907L7.25 21.5zm12.626 0L24.75 21.5l-5.375 2.688z"/></svg>';
// B: mdi's d20-outline hexagon, with live <text> faces instead of the baked-in "20".
const HEX = 'M21 16.5c0 .38-.21.71-.53.88l-7.9 4.44c-.16.12-.36.18-.57.18s-.41-.06-.57-.18l-7.9-4.44A.99.99 0 0 1 3 16.5v-9c0-.38.21-.71.53-.88l7.9-4.44c.16-.12.36-.18.57-.18s.41.06.57.18l7.9 4.44c.32.17.53.5.53.88zM12 4.15L5 8.09v7.82l7 3.94l7-3.94V8.09z';
const spinFaces = [7, 13, 2, 18, 11, 5].map((n, i) =>
  `<text class="face spin" x="12" y="15.4" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor" style="animation-delay:${-i * 0.1}s">${n}</text>`).join('');
const FLICKER_D20 = `<svg viewBox="0 0 24 24" class="icon-main" aria-hidden="true"><path fill="currentColor" d="${HEX}"/><g class="faces">${spinFaces}<text class="face final" x="12" y="15.4" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">20</text></g></svg>`;
const syncFaces = [14, 3, 19, 8, 12, 1, 17, 6].map((n, i) =>
  `<text class="face sync" x="12" y="15.4" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor" style="animation-delay:${-i * 0.225}s">${n}</text>`).join('');
const SYNC_D20 = `<svg viewBox="0 0 24 24" class="icon-main" aria-hidden="true"><path fill="currentColor" d="${HEX}"/>${syncFaces}<text class="face final" x="12" y="15.4" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">20</text></svg>`;
// Reroll: mdi dice-multiple-outline.
const REROLL = '<svg viewBox="0 0 24 24" class="icon-reroll" aria-hidden="true"><path fill="currentColor" d="M14 8c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1m-2 4v7H5v-7zm.78-2H4.22C3.55 10 3 10.55 3 11.22v8.56c0 .67.55 1.22 1.22 1.22h8.56c.67 0 1.22-.55 1.22-1.22v-8.56c0-.67-.55-1.22-1.22-1.22m7-7h-8.56C10.55 3 10 3.55 10 4.22V8h2V5h7v7h-3v2h3.78c.67 0 1.22-.55 1.22-1.22V4.22C21 3.55 20.45 3 19.78 3M17 8c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1m0 3c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1M7 15c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1m3 3c-.55 0-1-.45-1-1s.45-1 1-1s1 .45 1 1s-.45 1-1 1"/></svg>';
// Reroll alt: the same d20 with a small ↻ badge.
const badge = '<svg viewBox="0 0 24 24" class="icon-reroll" aria-hidden="true"><g transform="translate(-2 -1) scale(.85)"><path fill="currentColor" d="' + HEX + '"/></g><path d="M22 14a5 5 0 1 1-1.6-3.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M21.5 8.5v2.5H19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const variants = [
  { anim: 'tumble', title: 'A · Tumble (Font Awesome d20)', note: 'Solid d20 hops and turns in 90° steps. Reroll: two dice (mdi).', icons: FA_D20 + REROLL },
  { anim: 'flicker', title: 'B · Wobble + number flicker (mdi hexagon, live faces)', note: 'Rocks while the face flickers like a slot machine, lands on 20. Reroll: d20 with a ↻ badge.', icons: FLICKER_D20 + badge },
  { anim: 'flip', title: 'C · 3D flip (Line Awesome wireframe d20)', note: 'Flat CSS perspective flip. Reroll: two dice (mdi).', icons: LA_D20 + REROLL },
  { anim: 'both', title: 'D1 · Tumble + flicker (whole die turns)', note: 'A’s hops with B’s face swaps; the numbers turn with the die. Reroll: d20 with a ↻ badge.', icons: FLICKER_D20 + badge },
  { anim: 'upright', title: 'D2 · Tumble + flicker (numbers stay upright)', note: 'The hexagon tumbles while the face counter-rotates, so every number stays readable. Reroll: d20 with a ↻ badge.', icons: FLICKER_D20 + badge },
  { anim: 'synced', title: 'D3 · Tumble + flicker, in step', note: 'D1, but the number changes once per quarter-turn, each time the die “lands”. One motion, one rhythm. Reroll: d20 with a ↻ badge.', icons: SYNC_D20 + badge },
  { anim: 'final', title: 'D4 · D3 roll, lands as two dice', note: 'Tumble with the number changing on each hop (turning with the die), then it pops into the two-dice Reroll icon (mdi).', icons: SYNC_D20 + REROLL },
];

const grid = document.getElementById('grid');
const tpl = document.getElementById('tpl');
for (const v of variants) {
  const card = tpl.content.firstElementChild.cloneNode(true);
  card.querySelector('h2').textContent = v.title;
  card.querySelector('p').textContent = v.note;
  const btn = card.querySelector('.gen');
  btn.dataset.anim = v.anim;
  card.querySelector('.icons').outerHTML = v.icons;
  const preview = card.querySelector('.preview');
  const rooms = card.querySelector('.rooms');
  const live = card.querySelector('.state');
  let drawnRooms = null;
  const set = (s) => { btn.dataset.state = s; btn.disabled = s === 'rolling'; live.textContent = s; };
  const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  rooms.onchange = () => { if (btn.dataset.state === 'reroll' && rooms.value !== drawnRooms) set('ready');
                           if (btn.dataset.state === 'ready' && rooms.value === drawnRooms) set('reroll'); };
  btn.onclick = () => {
    set('rolling'); preview.classList.add('dim'); btn.setAttribute('aria-busy', 'true');
    setTimeout(() => {
      btn.removeAttribute('aria-busy'); preview.classList.remove('dim');
      if (document.getElementById('fail').checked) {
        document.getElementById('fail').checked = false;
        set('ready'); replay(btn, 'shake'); live.textContent = 'error';
        return;
      }
      drawnRooms = rooms.value;
      drawMap(preview, Math.random() * 2 ** 32 >>> 0, +rooms.value);
      set('reroll'); replay(btn, 'flash'); replay(preview, 'arrive');
      live.textContent = 'New map generated';
    }, +document.getElementById('dur').value);
  };
  grid.append(card);
}

// A stand-in "map": random rooms on a grid, just so the arrival is visible.
function drawMap(el, seed, n) {
  let s = seed || 1; const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 2 ** 32);
  const c = document.createElement('canvas'); c.width = 300; c.height = 200;
  const g = c.getContext('2d'); const st = getComputedStyle(document.documentElement);
  g.fillStyle = st.getPropertyValue('--card'); g.fillRect(0, 0, 300, 200);
  g.strokeStyle = st.getPropertyValue('--border');
  for (let x = 0; x <= 300; x += 10) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 200); g.stroke(); }
  for (let y = 0; y <= 200; y += 10) { g.beginPath(); g.moveTo(0, y); g.lineTo(300, y); g.stroke(); }
  g.fillStyle = st.getPropertyValue('--foreground');
  for (let i = 0; i < n; i++) g.fillRect(10 * (1 + (rnd() * 22 | 0)), 10 * (1 + (rnd() * 13 | 0)), 10 * (3 + (rnd() * 5 | 0)), 10 * (2 + (rnd() * 4 | 0)));
  el.replaceChildren(c);
}

document.getElementById('dark').onchange = (e) => document.documentElement.classList.toggle('dark', e.target.checked);
document.getElementById('reduce').onchange = (e) => document.documentElement.classList.toggle('reduce', e.target.checked);
if (matchMedia('(prefers-color-scheme: dark)').matches) { document.getElementById('dark').checked = true; document.documentElement.classList.add('dark'); }
</script>
</body>
</html>
