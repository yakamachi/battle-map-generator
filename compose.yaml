# Local development only. The SA password below is a throwaway for this container;
# Azure SQL uses the app's managed identity and has no password.
# A fixed project name: every checkout of this repo (including git worktrees) shares one
# container and volume, instead of each binding port 1433 for its own.
name: battle-map-generator

services:
  sqlserver:
    # Pinned, and bumped deliberately together with api.Tests/Infrastructure/SqlServerFixture.cs:
    # the healthcheck below depends on the sqlcmd path inside the image.
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev_Only_Passw0rd!"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    # Healthy only once a login works, so `docker compose up --wait` (e2e's db:up) returns when
    # migrations can run. $$ leaves the variable to the container's shell.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  sqlserver-data:
